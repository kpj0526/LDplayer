# ldmanager configuration (TP-001 stage 1 skeleton)
#
# Copy this file to configs/config.yaml (git-ignored) and fill in your own
# values. Nothing in this project guesses or hardcodes an ADB host:port —
# every entry below is a placeholder that must be set explicitly per
# environment before it is used.
#
# This file is scanned for anything that looks like a credential
# (password, token, api_key, secret, ...) and load is refused if found.
# Never put real credentials here.
#
# adb_mapping: LD1..LD9 -> "host:port" string, or null while unassigned.
#
# This mapping is always explicit and user-supplied — ldmanager never
# guesses a port and `adb devices` discovery never auto-assigns a serial
# to an account on your behalf; discovery only reports what's currently
# visible so a configured serial can be cross-checked against it.
#
# To actually run the LD1..LD9 discovery/connection-status flow (stage
# 3), all nine entries below must be filled in with distinct serials —
# a missing entry, a duplicate serial, or anything other than exactly
# LD1..LD9 is rejected before any ADB call is made.
adb_mapping:
  LD1: null
  LD2: null
  LD3: null
  LD4: null
  LD5: null
  LD6: null
  LD7: null
  LD8: null
  LD9: null

# Per-account (LD1..LD9) task/error log rotation + retention policy.
# All values below are safe defaults; omit this whole section to use them.
logging:
  root_dir: logs
  retention_days: 14
  max_bytes: 5000000
  backup_count: 5

# Where diagnostic screenshot *paths* are rooted (LD1..LD9 get their own
# subdirectory). Stage 2 only plans paths/metadata here; no image is
# captured until a later stage implements real ADB capture.
diagnostics:
  screenshot_dir: diagnostics/screenshots
