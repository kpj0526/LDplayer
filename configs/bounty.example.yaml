# ldmanager free regional-bounty five-slot configuration (MVP-001-CV)
#
# EVERY value below is a PLACEHOLDER example, not a calibrated real
# value -- see docs/REAL_CAPTURE_CHECKLIST.md. Copy this file to
# configs/bounty.yaml (git-ignored) and edit it, or point
# LDMANAGER_BOUNTY_CONFIG at a different path.
#
# IMPORTANT: the refresh popup is verified STRUCTURALLY, by two fixed
# UI landmarks (an anchor icon/frame region and a title-label region)
# -- never by reading the displayed refresh cost, which changes each
# time. Do not repurpose these two fields for a cost value.

screen_size:
  width: 960
  height: 540

templates_dir: templates
threshold: 0.8

# Map each configured label to a lossless crop from an actual LDPlayer
# screenshot.  Files are relative to templates_dir.  Populate every label
# used below before enabling Start; absent files fail closed (no tap).
template_map:
  # Customer-video initial assets. The target crop contains BOTH the
  # phrase and 0/200, so it is deliberately used for both positive checks.
  "모든 몬스터 처치": "target_all_monsters_0_of_200.png"
  "200": "target_all_monsters_0_of_200.png"
  target_all_monsters_0_of_200: "target_all_monsters_0_of_200.png"
  "지역 퀘스트 갱신": "refresh_confirm_title.png"
  "확인": "refresh_confirm_title.png"
  # Do not map a generic active mission to 200/200. A future native ADB
  # capture should provide an exact completed-progress crop; until then the
  # independently matched complete button is the completion gate.
  "완료": "button_complete.png"
  "보상 획득": "reward_result_header.png"
  "결과": "reward_result_header.png"
  "자유 토벌작전": "mission_slots_panel.png"
  mission_slot_unselected: "mission_slot_unselected.png"
  mission_slot_selected: "mission_slot_selected.png"
  button_refresh_confirm: "button_refresh_confirm.png"
  button_refresh_4400: "button_refresh_4400.png"
  button_refresh_6600: "button_refresh_6600.png"
  button_refresh_9900: "button_refresh_9900.png"
  button_refresh_14900: "button_refresh_14900.png"
  button_accept_mission: "button_accept_mission.png"
  button_complete: "button_complete.png"
  button_claim_reward: "button_claim_reward.png"
  button_close_reward: "button_close_reward.png"

# Tap points to select/check each of the 5 bounty slots. Exactly 5
# entries expected by the state machine (config itself allows any
# non-empty list; ldmanager.bounty_mission iterates whatever it's given).
slot_select_points:
  - {x: 0.10, y: 0.20}
  - {x: 0.10, y: 0.35}
  - {x: 0.10, y: 0.50}
  - {x: 0.10, y: 0.65}
  - {x: 0.10, y: 0.80}

# A mission is only accepted when BOTH of these are recognized in the
# currently-selected slot's opened mission panel -- phrase alone or
# quantity alone is never enough.
mission_phrase_roi: {x: 0.30, y: 0.20, width: 0.40, height: 0.08}
mission_phrase_label: "모든 몬스터 처치"
mission_quantity_roi: {x: 0.30, y: 0.30, width: 0.20, height: 0.06}
mission_quantity_label: "200"

# Refresh (reroll) flow for the currently-selected slot.
refresh_button_point: {x: 0.85, y: 0.90}

# Structural popup verification -- two independent, cost-INDEPENDENT
# landmarks that must BOTH be recognized before the confirm button is
# ever tapped.
refresh_popup_anchor_roi: {x: 0.35, y: 0.40, width: 0.30, height: 0.10}
refresh_popup_anchor_label: "새로고침"
refresh_popup_title_roi: {x: 0.35, y: 0.30, width: 0.30, height: 0.08}
refresh_popup_title_label: "확인"
refresh_confirm_point: {x: 0.55, y: 0.60}

# Kill-progress / completion eligibility -- two independent signals;
# either one confirms eligibility to select+complete. 0-199/200 must
# never trigger complete/claim.
kill_progress_roi: {x: 0.40, y: 0.05, width: 0.20, height: 0.06}
kill_progress_complete_label: "200/200"
complete_state_roi: {x: 0.05, y: 0.05, width: 0.15, height: 0.06}
complete_state_label: "완료"

# Complete -> reward -> claim -> result -> close -> mission list.
select_complete_point: {x: 0.10, y: 0.20}
complete_button_point: {x: 0.85, y: 0.90}
reward_screen_roi: {x: 0.30, y: 0.30, width: 0.40, height: 0.15}
reward_screen_label: "보상 획득"
claim_point: {x: 0.50, y: 0.70}
result_screen_roi: {x: 0.30, y: 0.20, width: 0.40, height: 0.15}
result_screen_label: "결과"
close_result_point: {x: 0.90, y: 0.10}
mission_list_roi: {x: 0.05, y: 0.05, width: 0.30, height: 0.08}
mission_list_label: "현상금 목록"

# Bounded retry/timeout policy -- every loop stops after this many
# attempts rather than looping forever.
max_capture_attempts: 3
max_refresh_attempts: 5
max_popup_verify_attempts: 3
max_kill_progress_poll_attempts: 10
max_reward_verify_attempts: 3
max_result_verify_attempts: 3
max_mission_list_verify_attempts: 3
retry_delay_seconds: 1.0

# --- GAME-CAL-001: screen classification (all optional; omit any/all of
# this section and that check is simply skipped, never fabricated). See
# ldmanager/screen_classification.py's module docstring for the full
# contract. Calibrate every ROI/label below from real captures -- values
# here are PLACEHOLDERS, same as the rest of this file.
#
# Stable, STATIC screen-layout chrome only (Mission tab / Region tab /
# mission-list-or-detail panel FRAME) -- e.g. never a mission-list PANEL
# TITLE like "자유 토벌작전"/"Free Subjugation", which only appears for
# one specific objective type and would wrongly reject every other
# mission's screen as a MISMATCH. Never a reward amount or a dynamic
# progress counter either. At least min_stable_anchor_matches (default:
# all of them) must match, or the screen is classified MISMATCH.
stable_screen_anchors:
  - {roi: {x: 0.0, y: 0.0, width: 0.15, height: 0.06}, label: "mission_screen"}
  - {roi: {x: 0.0, y: 0.90, width: 0.15, height: 0.08}, label: "region_tab"}
# min_stable_anchor_matches: 2

# Whole-button refresh/reroll variants (OR-matched) that mark the screen
# as showing a currency/refresh action -- e.g. the customer's "6600"
# refresh button. Defaults to the four button_refresh_* labels already
# used above; only listed here if you want to override that default.
# currency_action_labels: ["button_refresh_4400", "button_refresh_6600", "button_refresh_9900", "button_refresh_14900"]

# ONE generic, non-digit-specific "mission in progress" indicator (e.g.
# a progress-bar frame graphic) -- deliberately never a fixed "x/y"
# digit crop tied to one mission's specific target quantity (a
# "130/180" mission and a "0/200" mission must both be recognized as
# in-progress by the SAME template, not two different digit-specific
# ones).
# in_progress_roi: {x: 0.40, y: 0.05, width: 0.20, height: 0.06}
# in_progress_label: "in_progress"

# NOTE: whether the CURRENTLY SELECTED mission is the required "모든
# 몬스터 처치" objective is a completely separate check, driven by the
# EXISTING mission_phrase_roi/mission_phrase_label +
# mission_quantity_roi/mission_quantity_label (or target_all_monsters_
# 0_of_200) fields above -- never by stable_screen_anchors. A different,
# non-target mission title is a normal, valid screen (never a MISMATCH),
# just not one this project will ever act on.
