# ldmanager free regional-bounty five-slot configuration (MVP-001-CV)
#
# EVERY value below is a PLACEHOLDER example, not a calibrated real
# value -- see docs/REAL_CAPTURE_CHECKLIST.md. Copy this file to
# configs/bounty.yaml (git-ignored) and edit it, or point
# LDMANAGER_BOUNTY_CONFIG at a different path.
#
# IMPORTANT: the refresh popup is verified STRUCTURALLY, by two fixed
# UI landmarks (an anchor icon/frame region and a title-label region)
# -- never by reading the displayed refresh cost, which changes each
# time. Do not repurpose these two fields for a cost value.

# GAME-CAL-001 (real-capture rework): the customer's actual LDPlayer
# client captures are 1280x720 (verified against 3 real supplied PNGs --
# see tests/fixtures/game_cal_001/source/ and its PROVENANCE.md). Every
# stable_screen_anchors/complete_state/currency_action ROI and template
# below is calibrated against that real 1280x720 resolution -- if your
# own instance renders at a different resolution, re-measure screen_size
# with `adb shell wm size` (see docs/REAL_CAPTURE_CHECKLIST.md) and
# recalibrate the ROIs below to match your own captures.
screen_size:
  width: 1280
  height: 720

templates_dir: templates
threshold: 0.8

# Map each configured label to a lossless crop from an actual LDPlayer
# screenshot.  Files are relative to templates_dir.  Populate every label
# used below before enabling Start; absent files fail closed (no tap).
template_map:
  # Customer-video initial assets. The target crop contains BOTH the
  # phrase and 0/200, so it is deliberately used for both positive checks.
  "모든 몬스터 처치": "target_all_monsters_0_of_200.png"
  "200": "target_all_monsters_0_of_200.png"
  target_all_monsters_0_of_200: "target_all_monsters_0_of_200.png"
  "지역 퀘스트 갱신": "refresh_confirm_title.png"
  "확인": "refresh_confirm_title.png"
  # Do not map a generic active mission to 200/200. A future native ADB
  # capture should provide an exact completed-progress crop; until then the
  # independently matched complete button is the completion gate.
  "완료": "button_complete.png"
  "보상 획득": "reward_result_header.png"
  "결과": "reward_result_header.png"
  "자유 토벌작전": "mission_slots_panel.png"
  # SLOT-SELECT-CALIBRATION-001 (real-capture rework): mission_slot_unselected/
  # mission_slot_selected are DELIBERATELY NOT mapped here. Real evidence
  # (tests/fixtures/game_cal_001/source_extra/) showed two structural
  # problems: (1) the crop bakes in the literal mission title text
  # ("자유 토벌작전"), the exact anti-pattern GAME-CAL-001 already fixed
  # elsewhere; (2) even with a perfect crop, a single "find this anywhere
  # on screen" search can never tell slot 1 apart from slot 3 when both
  # show identical unselected styling -- template matching is the wrong
  # tool for "pick the Nth row of a list". Leaving these two labels
  # unmapped makes _tap_template() return None (not a hard False) for
  # them, so slot selection always uses the real, position-calibrated
  # slot_select_points/select_complete_point below instead -- exactly
  # the mechanism actually suited to this UI. Do not add real crops for
  # these two labels without first solving problem (2).
  button_refresh_confirm: "button_refresh_confirm.png"
  button_refresh_4400: "button_refresh_4400.png"
  button_refresh_6600: "button_refresh_6600.png"
  button_refresh_9900: "button_refresh_9900.png"
  button_refresh_14900: "button_refresh_14900.png"
  button_accept_mission: "button_accept_mission.png"
  button_complete: "button_complete.png"
  # REWARD-SCREEN-CALIBRATION-001 (real-capture rework): replaced with a
  # real crop from an actual customer "보상 받기" (Get Reward) screen --
  # see tests/fixtures/game_cal_001/source_extra/reward_screen.png and
  # its PROVENANCE.md entry. Confirmed (real OpenCVTemplateRecognizer)
  # to match only that real screen and not the 4 other real captures.
  button_claim_reward: "reward_claim_button.png"
  button_close_reward: "button_close_reward.png"
  # The "확률" (odds/probability) label -- generic reward-screen UI
  # chrome, never the mission title -- confirms the reward screen is
  # actually showing before claim is ever tapped.
  reward_odds_label: "reward_odds_label.png"
  # GAME-CAL-001 (real-capture rework): calibrated from 3 real, supplied
  # 1280x720 customer captures of the 임무 (Mission) > 지역 (Region)
  # detail screen -- see tests/fixtures/game_cal_001/ (source PNGs +
  # PROVENANCE.md) and tests/test_screen_classification_real_assets.py
  # (loads these exact files and proves the expected classification).
  # Used by stable_screen_anchors (screen-layout confirmation), the
  # completed-state check, the currency-action check, and the
  # mission-target-phrase fast path, respectively.
  mission_header: "mission_header.png"
  mission_objective_label: "mission_objective_label.png"
  complete_badge: "complete_badge.png"
  currency_action_4400: "currency_action_4400.png"
  mission_target_phrase: "mission_target_phrase.png"

# Tap points to select/check each of the 5 bounty slots. Exactly 5
# entries expected by the state machine (config itself allows any
# non-empty list; ldmanager.bounty_mission iterates whatever it's given).
#
# SLOT-SELECT-CALIBRATION-001 (real-capture rework): calibrated from a
# real 1280x720 customer capture of the actual 임무 목록 (mission list)
# panel -- see tests/fixtures/game_cal_001/source_extra/
# mission_list_row1_completed.png and its PROVENANCE.md. Row band
# boundaries were measured directly (mean-brightness scan of the list
# column, not eyeballed) and centered: row 1 y=186-256 (center 221),
# row 2 y=268-337 (center 302), row 3 y=350-418 (center 384), row 4
# y=431-499 (center 465), row 5 y=513-581 (center 547); x centered on
# the row banner (~150px of 1280). The prior placeholder values (evenly
# spaced 0.20/0.35/0.50/0.65/0.80) were off by up to 0.11 -- enough to
# miss the ~0.097-tall row bands entirely on a real capture.
slot_select_points:
  - {x: 0.1172, y: 0.3069}
  - {x: 0.1172, y: 0.4194}
  - {x: 0.1172, y: 0.5333}
  - {x: 0.1172, y: 0.6458}
  - {x: 0.1172, y: 0.7597}

# A mission is only accepted when BOTH of these are recognized in the
# currently-selected slot's opened mission panel -- phrase alone or
# quantity alone is never enough.
mission_phrase_roi: {x: 0.30, y: 0.20, width: 0.40, height: 0.08}
mission_phrase_label: "모든 몬스터 처치"
mission_quantity_roi: {x: 0.30, y: 0.30, width: 0.20, height: 0.06}
mission_quantity_label: "200"

# Refresh (reroll) flow for the currently-selected slot.
refresh_button_point: {x: 0.85, y: 0.90}

# Structural popup verification -- two independent, cost-INDEPENDENT
# landmarks that must BOTH be recognized before the confirm button is
# ever tapped.
refresh_popup_anchor_roi: {x: 0.35, y: 0.40, width: 0.30, height: 0.10}
refresh_popup_anchor_label: "새로고침"
refresh_popup_title_roi: {x: 0.35, y: 0.30, width: 0.30, height: 0.08}
refresh_popup_title_label: "확인"
refresh_confirm_point: {x: 0.55, y: 0.60}

# Kill-progress / completion eligibility -- two independent signals;
# either one confirms eligibility to select+complete. 0-199/200 must
# never trigger complete/claim.
kill_progress_roi: {x: 0.40, y: 0.05, width: 0.20, height: 0.06}
kill_progress_complete_label: "200/200"
# GAME-CAL-001 (real-capture rework): complete_state_roi/label below are
# calibrated from the real completed capture's "완료" badge (see
# template_map's complete_badge entry above) -- confirmed to correctly
# NOT match the two real non-completed captures (their "(16/165)"/
# "(0/450)" counters occupy this same ROI instead).
complete_state_roi: {x: 0.4375, y: 0.7083, width: 0.1172, height: 0.0694}
complete_state_label: "complete_badge"

# Complete -> reward -> claim -> result -> close -> mission list.
# COMPLETE-SLOT-TRACKING-001: select_complete_point is kept for
# config-schema/backward-compat stability only -- it is no longer
# consulted by run_one_cycle's live completion path, which now
# re-selects whichever slot_select_points[i] was actually verified
# eligible (never a fixed "always row 1" point -- see
# docs/HANDOFF_CODE.md's COMPLETE-SLOT-TRACKING-001 section).
select_complete_point: {x: 0.1172, y: 0.3069}
complete_button_point: {x: 0.85, y: 0.90}
# REWARD-SCREEN-CALIBRATION-001 (real-capture rework): calibrated from
# a real customer capture of the actual "보상 받기" screen (see
# tests/fixtures/game_cal_001/source_extra/reward_screen.png +
# PROVENANCE.md). reward_screen_label points at the "확률" (odds) label
# -- generic UI chrome present regardless of mission title -- confirmed
# to NOT match any of the mission-detail/list real captures.
reward_screen_roi: {x: 0.4531, y: 0.2569, width: 0.0938, height: 0.0903}
reward_screen_label: "reward_odds_label"
# Real, measured center of the "보상 받기" button -- fixed-fallback only
# (the dynamic button_claim_reward template above is tried first).
claim_point: {x: 0.5012, y: 0.7104}
result_screen_roi: {x: 0.30, y: 0.20, width: 0.40, height: 0.15}
result_screen_label: "결과"
close_result_point: {x: 0.90, y: 0.10}
mission_list_roi: {x: 0.05, y: 0.05, width: 0.30, height: 0.08}
mission_list_label: "현상금 목록"

# Bounded retry/timeout policy -- every loop stops after this many
# attempts rather than looping forever.
max_capture_attempts: 3
max_refresh_attempts: 5
max_popup_verify_attempts: 3
max_kill_progress_poll_attempts: 10
max_reward_verify_attempts: 3
max_result_verify_attempts: 3
max_mission_list_verify_attempts: 3
retry_delay_seconds: 1.0

# --- GAME-CAL-001 (real-capture rework): screen classification --------
#
# Calibrated from 3 REAL, customer-supplied 1280x720 captures of the
# 임무 (Mission) > 지역 (Region) detail screen -- not guesses. See
# tests/fixtures/game_cal_001/ (source PNGs + PROVENANCE.md) and
# tests/test_screen_classification_real_assets.py, which loads these
# exact source images (not a fake always-match recognizer) and proves
# each expected classification. See
# ldmanager/screen_classification.py's module docstring for the full
# contract. This section is still optional overall (omit it and the
# corresponding check is simply skipped, never fabricated) -- but every
# value actually present below is real, not a placeholder.
#
# Stable, STATIC screen-layout chrome only -- the 임무 (Mission) modal
# header icon+text, and the 임무 목표 ("Mission Objective") row label.
# Deliberately NEVER a mission-list PANEL TITLE like "자유
# 토벌작전"/"야왕궁 토벌작전" ("Free Subjugation"/whatever other
# objective), which only appears for one specific mission and would
# wrongly reject every other mission's valid screen as a MISMATCH --
# confirmed directly: both a target ("자유 토벌작전") and a non-target
# ("야왕궁 토벌작전") real capture match both anchors below identically.
# Never a reward amount or a dynamic progress counter either. Both
# anchors are required (min_stable_anchor_matches defaults to "all").
stable_screen_anchors:
  - {roi: {x: 0.0, y: 0.0, width: 0.1172, height: 0.1111}, label: "mission_header"}
  - {roi: {x: 0.2344, y: 0.6389, width: 0.1250, height: 0.0833}, label: "mission_objective_label"}

# Whole-widget crop of the currency-cost action box (counter + cost +
# icon) that appears on any active (not-yet-completed) mission in this
# screen -- confirmed present, at this same location, on both the real
# 16/165 target-in-progress capture and the real 0/450 non-target
# capture. Both supplied real examples show a cost of 4400; a mission
# with a different displayed cost is not yet covered by this one crop
# (NEEDS_REAL_TEST -- add further currency_action_<cost> crops/labels,
# OR-matched the same way button_refresh_4400/6600/9900/14900 already
# are above, once real captures of other costs are available).
currency_action_labels: ["currency_action_4400"]

# No distinct, non-digit-specific "in progress" graphic (separate from
# the currency-action box above) was present in either real
# not-yet-completed capture -- left uncalibrated rather than guessed.
# Both real non-completed examples classify safely as CURRENCY_ACTION
# instead (still zero-touch either way).
# in_progress_roi: {x: 0.40, y: 0.05, width: 0.20, height: 0.06}
# in_progress_label: "in_progress"

# NOTE: whether the CURRENTLY SELECTED mission is the required "모든
# 몬스터 처치" objective is a completely separate check (never by
# stable_screen_anchors) -- driven by template_map's mission_target_phrase
# entry above (a real crop of that exact phrase, confirmed to correctly
# NOT match the real non-target capture's different phrase, "냉혈사
# 처치"). A non-target mission title is a normal, valid screen (never a
# MISMATCH), just not one this project will ever act on.
